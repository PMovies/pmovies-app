<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PMovies Arena · Spider-Man vs Odysseus</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#back { position: fixed; top: 12px; left: 14px; color: #555; font: 600 11px/1 monospace; text-decoration: none; letter-spacing: 1px; z-index: 10; }
#back:hover, #back:active { color: #fff; }
#portrait-warn {
  display: none; position: fixed; inset: 0; background: #000;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; color: #ffcc00; font: bold 14px monospace; text-align: center; gap: 20px;
}
#portrait-warn .icon { font-size: 52px; animation: spin 2s linear infinite; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>
</head>
<body>
<a href="index.html" id="back">← PMOVIES</a>
<div id="portrait-warn">
  <div class="icon">&#x21BA;</div>
  <div>ROTATE YOUR DEVICE</div>
  <div style="font-size:9px;color:#888;margin-top:4px">This game plays in landscape</div>
</div>
<canvas id="c"></canvas>
<script>
// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 400;
canvas.width = W; canvas.height = H;

let canvasScale = 1;
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvasScale = s;
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
  // Portrait warning
  const pw = document.getElementById('portrait-warn');
  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  pw.style.display = (isMobile && window.innerHeight > window.innerWidth) ? 'flex' : 'none';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ── Touch detection ───────────────────────────────────────────────────────────
const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// Touch zones in canvas space (800×400)
const ZONES = {
  left:    { x:  12, y: 300, w: 80, h: 90 },
  jump:    { x: 100, y: 275, w: 80, h: 75 },
  right:   { x: 188, y: 300, w: 80, h: 90 },
  block:   { x: 518, y: 308, w: 80, h: 82 },
  attack:  { x: 608, y: 290, w: 90, h: 100 },
  special: { x: 706, y: 308, w: 80, h: 82 },
};

const activeTouch  = new Set();
const touchPressed = new Set();

function screenToCanvas(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  return { x: (cx - rect.left) / canvasScale, y: (cy - rect.top) / canvasScale };
}
function inZone(px, py, z) { return px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h; }
function getZonesFromTouches(tList) {
  const s = new Set();
  for (let i=0;i<tList.length;i++) {
    const {x,y}=screenToCanvas(tList[i].clientX,tList[i].clientY);
    for (const [n,z] of Object.entries(ZONES)) if(inZone(x,y,z)) s.add(n);
  }
  return s;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  _unlockAudio();
  if (scene==='title'||scene==='round_end'||scene==='match_end') { pressed['Enter']=true; return; }
  if (scene==='select') {
    for (let i=0;i<e.changedTouches.length;i++) {
      const {x,y}=screenToCanvas(e.changedTouches[i].clientX,e.changedTouches[i].clientY);
      if (y < 340) { playerChar = x < W/2 ? 'spidey' : 'odyssey'; sfx.select(); }
      else { pressed['Enter']=true; }
    }
    return;
  }
  const newZ = getZonesFromTouches(e.changedTouches);
  for (const z of newZ) { if (!activeTouch.has(z)) touchPressed.add(z); activeTouch.add(z); }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  activeTouch.clear();
  for (const z of getZonesFromTouches(e.touches)) activeTouch.add(z);
}, { passive:false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  activeTouch.clear();
  for (const z of getZonesFromTouches(e.touches)) activeTouch.add(z);
}, { passive:false });

// ── Audio ─────────────────────────────────────────────────────────────────────
let AC = null, _audioReady = false;

function _unlockAudio() {
  if (_audioReady) return;
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  // Silent buffer — the only way to unlock iOS audio
  const buf = AC.createBuffer(1, 1, 22050);
  const src = AC.createBufferSource();
  src.buffer = buf; src.connect(AC.destination); src.start(0);
  AC.resume().then(() => { _audioReady = true; });
}

function tone(freq, type, dur, vol = 0.3) {
  if (!_audioReady || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
const sfx = {
  punch:   ()=>{ tone(180,'square',0.08,0.5); tone(110,'sawtooth',0.06,0.3); },
  block:   ()=>tone(500,'square',0.04,0.2),
  hurt:    ()=>tone(190,'sawtooth',0.1,0.25),
  jump:    ()=>tone(320,'sine',0.18,0.15),
  select:  ()=>tone(660,'square',0.08,0.3),
  ko:      ()=>{ tone(90,'sawtooth',0.7,0.5); tone(60,'square',0.9,0.4); },
  special: ()=>{ [220,440,880].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.25,0.4),i*60)); },
  win:     ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'square',0.18,0.45),i*110)); },
  start:   ()=>{ [440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,'square',0.12,0.4),i*90)); },
};

// ── Config ────────────────────────────────────────────────────────────────────
const GROUND       = H - 60;
const GRAVITY      = 1900;
const JUMP_VEL     = -620;
const ATTACK_RANGE = 70;
const CHARS = {
  spidey:  { name:'SPIDER-MAN', movie:'Marvel · Jul 2025',  color:'#cc1111', color2:'#0a2fd6', speed:230, power:13, defense:0.55, specialPower:22, specialName:'WEB SHOT!',      specialColor:'#88aaff' },
  odyssey: { name:'ODYSSEUS',   movie:'Nolan · Jul 2025',   color:'#b8860b', color2:'#8b4513', speed:175, power:13, defense:0.58, specialPower:22, specialName:'WARRIOR RAGE!', specialColor:'#ff8800' },
};

// ── Game state ────────────────────────────────────────────────────────────────
let scene='title', playerChar='spidey';
let round=1, scores={player:0,cpu:0};
let roundWinner=null, matchWinner=null;
let cdVal=3, cdTimer=1;
let roundEndTimer=0, fightTimer=60;
let actionText='', actionColor='#ffcc00', actionTimer=0;
let p1, p2;

// ── Keyboard input ────────────────────────────────────────────────────────────
const keys={}, pressed={};
window.addEventListener('keydown',e=>{ _unlockAudio(); if(!keys[e.code]) pressed[e.code]=true; keys[e.code]=true; if(['ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup',  e=>{ keys[e.code]=false; });
function just(c){ const v=pressed[c]; pressed[c]=false; return v; }
function justAny(...cc){ return cc.some(c=>just(c)); }

// ── Fighter ───────────────────────────────────────────────────────────────────
class Fighter {
  constructor(charKey,x,facing,isAI){
    this.charKey=charKey; this.cfg=CHARS[charKey];
    this.x=x; this.y=GROUND; this.vx=0; this.vy=0;
    this.hp=100; this.special=0; this.facing=facing; this.isAI=isAI;
    this.state='idle'; this.stTimer=0; this.hitCD=0; this.flash=0;
    this.onGrd=true; this.spActive=false; this.spTimer=0; this.aiCD=0;
  }
  get hitbox(){ return {x:this.x-14,y:this.y-62,w:28,h:62}; }
  get atkbox(){
    if(this.state!=='attack'||this.stTimer>0.22) return null;
    return {x:this.x+this.facing*20-10,y:this.y-52,w:36,h:32};
  }
  doJump(){ if(this.onGrd&&this.state!=='attack'&&this.state!=='ko'){ this.vy=JUMP_VEL; this.onGrd=false; this.state='jump'; sfx.jump(); } }
  doAttack(){ if(this.state!=='attack'&&this.state!=='hurt'&&this.state!=='ko'&&this.onGrd){ this.state='attack'; this.stTimer=0.36; sfx.punch(); } }
  doBlock(on){ if(this.state!=='attack'&&this.state!=='special'&&this.state!=='ko') this.state=on?'block':(this.onGrd?'idle':'jump'); }
  doSpecial(){
    if(this.special<100||this.state==='attack'||this.state==='ko') return;
    this.special=0; this.spActive=true; this.spTimer=0.55;
    this.state='special'; this.stTimer=0.55;
    sfx.special(); showAction(this.cfg.specialName,this.cfg.specialColor);
  }
  takeDmg(amount,fromSp=false){
    if(this.hitCD>0) return false;
    const blocked=this.state==='block';
    const dmg=blocked?Math.floor(amount*(1-this.cfg.defense)):amount;
    if(blocked){ sfx.block(); showAction('BLOCKED!','#ffffff'); } else sfx.hurt();
    this.hp=Math.max(0,this.hp-dmg); this.flash=0.18; this.hitCD=0.28;
    if(!blocked){ this.state='hurt'; this.stTimer=0.22; this.vx=-this.facing*130; }
    this.special=Math.min(100,this.special+(fromSp?10:6));
    return true;
  }
  update(dt,opp){
    if(this.state==='ko') return;
    this.hitCD=Math.max(0,this.hitCD-dt); this.flash=Math.max(0,this.flash-dt);
    this.stTimer=Math.max(0,this.stTimer-dt); this.spTimer=Math.max(0,this.spTimer-dt);
    if(this.spTimer<=0) this.spActive=false;
    if(this.stTimer<=0&&(this.state==='attack'||this.state==='hurt'||this.state==='special'))
      this.state=this.onGrd?'idle':'jump';
    if(this.state!=='attack'&&this.state!=='hurt') this.facing=opp.x>this.x?1:-1;
    if(this.isAI) this.ai(dt,opp);
    if(!this.onGrd) this.vy+=GRAVITY*dt;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.y>=GROUND){ this.y=GROUND; this.vy=0; if(!this.onGrd){ this.onGrd=true; if(this.state==='jump') this.state='idle'; } }
    this.x=Math.max(28,Math.min(W-28,this.x));
    if(this.onGrd&&this.state!=='attack') this.vx*=Math.pow(0.04,dt);
    this.special=Math.min(100,this.special+4.5*dt);
  }
  ai(dt,pl){
    this.aiCD-=dt;
    if(this.aiCD>0||this.state==='hurt'||this.state==='attack'||this.state==='special') return;
    const dist=Math.abs(this.x-pl.x), agg=round===1?0.55:round===2?0.70:0.88;
    if(this.hp<20&&this.special>=100){ this.doSpecial(); this.aiCD=1.6; return; }
    if(this.special>=100&&dist<ATTACK_RANGE+15&&Math.random()<0.18*agg){ this.doSpecial(); this.aiCD=1.3; return; }
    if(dist>ATTACK_RANGE){
      if(Math.random()<agg) this.vx=this.facing*this.cfg.speed*0.88;
      if(Math.random()<0.07) this.doJump();
      if(this.state==='block') this.doBlock(false);
      this.aiCD=0.07;
    } else {
      const r=Math.random();
      if(r<0.52*agg)      { this.doAttack(); this.aiCD=0.48; }
      else if(r<0.72)     { this.doBlock(true); this.aiCD=0.28; setTimeout(()=>this.doBlock(false),280); }
      else if(r<0.85)     { this.doJump(); this.vx=(Math.random()<0.5?1:-1)*this.cfg.speed; this.aiCD=0.45; }
      else                { this.vx=-this.facing*this.cfg.speed*0.7; this.aiCD=0.28; }
    }
  }
}

// ── Collision ─────────────────────────────────────────────────────────────────
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function checkHits(atk,def){
  const ab=atk.atkbox;
  if(ab&&overlap(ab,def.hitbox)){ if(def.takeDmg(atk.cfg.power+Math.floor(Math.random()*3))) atk.special=Math.min(100,atk.special+8); }
  if(atk.spActive){
    const sb={x:atk.x+atk.facing*15-10,y:atk.y-80,w:90,h:80};
    if(overlap(sb,def.hitbox)){ def.takeDmg(atk.cfg.specialPower,true); atk.spActive=false; }
  }
}

// ── Action text ───────────────────────────────────────────────────────────────
function showAction(text,color='#ffcc00'){ actionText=text; actionColor=color; actionTimer=1.0; }

// ── Round init ────────────────────────────────────────────────────────────────
function initRound(){
  const cpu=playerChar==='spidey'?'odyssey':'spidey';
  p1=new Fighter(playerChar,170,1,false);
  p2=new Fighter(cpu,W-170,-1,true);
  fightTimer=60; scene='countdown'; cdVal=3; cdTimer=1.0;
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// ── Draw fighter dispatch ─────────────────────────────────────────────────────
function drawFighter(f){ f.charKey==='spidey'?drawSpidey(f):drawOdysseus(f); }

// ── Spider-Man ────────────────────────────────────────────────────────────────
function drawSpidey(f){
  const {x,y,facing:d,state:st,flash}=f, t=Date.now()/1000;
  ctx.save(); ctx.translate(x,y); if(d===-1) ctx.scale(-1,1);
  if(flash>0) ctx.globalAlpha=0.45+0.55*((Math.sin(t*50)+1)/2);
  ctx.fillStyle='#0a2fd6'; ctx.fillRect(-13,-28,10,28); ctx.fillRect(3,-28,10,28);
  ctx.fillStyle='#cc1111'; ctx.fillRect(-15,-5,13,6); ctx.fillRect(2,-5,13,6);
  ctx.fillStyle='#cc1111'; ctx.fillRect(-14,-58,28,32);
  ctx.fillStyle='#0a2fd6'; ctx.fillRect(-14,-58,5,32); ctx.fillRect(9,-58,5,32);
  ctx.fillStyle='#000'; ctx.fillRect(-4,-52,8,2); ctx.fillRect(-2,-50,4,8); ctx.fillRect(-6,-48,2,4); ctx.fillRect(4,-48,2,4);
  if(st==='attack'){
    ctx.fillStyle='#cc1111'; ctx.fillRect(14,-54,30,9); ctx.fillRect(44,-58,10,12);
    ctx.strokeStyle='#aaccff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(54,-52); ctx.lineTo(W,-52); ctx.stroke();
  } else if(st==='special'){
    ctx.fillStyle='#cc1111'; ctx.fillRect(14,-54,28,9); ctx.fillRect(-24,-54,10,9);
    ctx.strokeStyle='#88aaff'; ctx.lineWidth=2.5;
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(42,-52+i*7); ctx.lineTo(W,-52+i*7); ctx.stroke(); }
    ctx.fillStyle='#88aaff'; const ga=ctx.globalAlpha; ctx.globalAlpha=ga*0.15; ctx.fillRect(42,-72,W,50); ctx.globalAlpha=ga;
  } else if(st==='block'){
    ctx.fillStyle='#cc1111'; ctx.fillRect(-22,-58,10,9); ctx.fillRect(5,-62,9,9); ctx.fillRect(12,-54,9,9);
  } else {
    const sw=st==='idle'?Math.sin(t*1.5)*4:0;
    ctx.fillStyle='#cc1111'; ctx.fillRect(-24,-55+sw,10,9); ctx.fillRect(14,-55-sw,10,9);
  }
  ctx.fillStyle='#cc1111'; ctx.beginPath(); ctx.arc(0,-70,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.save(); ctx.translate(-5,-72); ctx.rotate(-0.18); ctx.fillRect(-5,-4,10,7); ctx.restore();
  ctx.save(); ctx.translate( 5,-72); ctx.rotate( 0.18); ctx.fillRect(-5,-4,10,7); ctx.restore();
  if(st==='jump'){ ctx.fillStyle='#cc1111'; ctx.fillRect(10,-10,18,8); }
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x,GROUND+2,18,5,0,0,Math.PI*2); ctx.fill();
}

// ── Odysseus ──────────────────────────────────────────────────────────────────
function drawOdysseus(f){
  const {x,y,facing:d,state:st,flash}=f, t=Date.now()/1000;
  ctx.save(); ctx.translate(x,y); if(d===-1) ctx.scale(-1,1);
  if(flash>0) ctx.globalAlpha=0.45+0.55*((Math.sin(t*50)+1)/2);
  ctx.fillStyle='#6b3800'; ctx.fillRect(-15,-6,13,6); ctx.fillRect(2,-6,13,6);
  ctx.fillStyle='#cd853f'; ctx.fillRect(-12,-30,10,24); ctx.fillRect(2,-30,10,24);
  ctx.fillStyle='#daa520'; ctx.fillRect(-10,-28,3,20); ctx.fillRect(4,-28,3,20);
  ctx.fillStyle='#7a3800'; ctx.fillRect(-16,-40,32,12);
  ctx.fillStyle='#5a2800'; for(let i=0;i<4;i++) ctx.fillRect(-14+i*8,-40,2,12);
  ctx.fillStyle='#b8860b'; ctx.fillRect(-15,-64,30,26);
  ctx.fillStyle='#daa520'; ctx.fillRect(-12,-61,6,22); ctx.fillRect(6,-61,6,22); ctx.fillRect(-12,-41,24,3);
  ctx.fillStyle='#8b6000'; ctx.fillRect(-13,-64,2,26); ctx.fillRect(11,-64,2,26);
  if(st!=='attack'&&st!=='special'){
    ctx.fillStyle='#7a6040'; ctx.beginPath(); ctx.ellipse(-28,-48,13,18,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#daa520'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#daa520'; ctx.beginPath(); ctx.arc(-28,-48,4,0,Math.PI*2); ctx.fill();
  }
  if(st==='attack'){
    ctx.fillStyle='#cd853f'; ctx.fillRect(14,-58,10,9); ctx.fillRect(-24,-58,10,9);
    ctx.strokeStyle='#7a5000'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(24,-54); ctx.lineTo(72,-54); ctx.stroke();
    ctx.fillStyle='#ccc'; ctx.beginPath(); ctx.moveTo(72,-63); ctx.lineTo(82,-54); ctx.lineTo(72,-45); ctx.closePath(); ctx.fill();
  } else if(st==='special'){
    ctx.fillStyle='#cd853f'; ctx.fillRect(14,-58,10,9); ctx.fillRect(-24,-58,10,9);
    ctx.strokeStyle='#ff8800'; ctx.lineWidth=3;
    const ga=ctx.globalAlpha; ctx.globalAlpha=ga*(0.5+0.5*Math.sin(t*18));
    ctx.beginPath(); ctx.arc(0,-38,38,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=ga;
    const ang=t*8; ctx.strokeStyle='#7a5000'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(Math.cos(ang)*-50,Math.sin(ang)*-20-50); ctx.lineTo(Math.cos(ang)*50,Math.sin(ang)*20-50); ctx.stroke();
  } else {
    ctx.fillStyle='#cd853f'; ctx.fillRect(-24,-58,10,9); ctx.fillRect(14,-58,10,9);
    ctx.strokeStyle='#7a5000'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(24,-58); ctx.lineTo(24,0); ctx.stroke();
    ctx.fillStyle='#ccc'; ctx.beginPath(); ctx.moveTo(18,-68); ctx.lineTo(24,-58); ctx.lineTo(30,-68); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#c8905a'; ctx.fillRect(-9,-82,18,22);
  ctx.fillStyle='#777'; ctx.fillRect(-13,-90,26,14); ctx.fillStyle='#666'; ctx.fillRect(-13,-84,26,5); ctx.fillRect(-4,-80,8,7);
  for(let i=0;i<7;i++){ ctx.fillStyle=`hsl(${i*5},80%,${38+i*3}%)`; ctx.fillRect(-4+i*2,-100-i+1,3,12+i); }
  ctx.fillStyle='#1a1000'; ctx.fillRect(-7,-84,5,3); ctx.fillRect(2,-84,5,3);
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(x,GROUND+2,20,5,0,0,Math.PI*2); ctx.fill();
}

// ── Background ────────────────────────────────────────────────────────────────
function drawBg(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#08021a'); sky.addColorStop(0.5,'#150830'); sky.addColorStop(1,'#301200');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,220,0.7)';
  [[90,30],[220,18],[400,10],[560,25],[700,15],[130,55],[350,40],[620,50],[780,35]].forEach(([sx,sy])=>ctx.fillRect(sx,sy,1.5,1.5));
  ctx.fillStyle='#e8e0c0'; ctx.beginPath(); ctx.arc(700,45,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ccc8a8'; ctx.beginPath(); ctx.arc(700,45,24,0,Math.PI*2); ctx.fill();
  for(let i=0;i<9;i++){
    const ax=25+i*85,aw=68,ah=130;
    ctx.fillStyle='#250e00'; ctx.fillRect(ax,GROUND-ah,aw,ah);
    ctx.fillStyle='#110600'; ctx.beginPath(); ctx.rect(ax+9,GROUND-ah+22,aw-18,ah-22); ctx.arc(ax+aw/2,GROUND-ah+22,(aw-18)/2,Math.PI,0); ctx.fill();
    ctx.fillStyle='#2e1200'; ctx.fillRect(ax,GROUND-ah,8,ah); ctx.fillRect(ax+aw-8,GROUND-ah,8,ah);
  }
  ctx.fillStyle='#250e00'; ctx.fillRect(0,GROUND-38,W,38);
  ctx.fillStyle='#3a1800'; ctx.fillRect(0,GROUND-40,W,4);
  ctx.fillStyle='#2e1800'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#c8a055'; ctx.fillRect(0,GROUND,W,8);
  ctx.fillStyle='#d4b070'; for(let i=0;i<28;i++) ctx.fillRect(i*29+6,GROUND+2,14,2);
  ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.fillRect(0,GROUND+8,W,14);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(){
  const P=14;
  function hpCol(hp){ return hp>50?'#22dd22':hp>25?'#ddaa00':'#dd2222'; }
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(P,P,290,42);
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
  ctx.fillText(p1.cfg.name,P+4,P+13);
  ctx.fillStyle='#777'; ctx.font='6px monospace'; ctx.fillText(p1.cfg.movie,P+4,P+23);
  ctx.fillStyle='#333'; ctx.fillRect(P+80,P+6,196,10);
  ctx.fillStyle=hpCol(p1.hp); ctx.fillRect(P+80,P+6,Math.max(0,p1.hp/100*196),10);
  ctx.strokeStyle='#666'; ctx.lineWidth=0.8; ctx.strokeRect(P+80,P+6,196,10);
  ctx.fillStyle='#222'; ctx.fillRect(P+80,P+20,196,5);
  ctx.fillStyle=p1.cfg.specialColor; ctx.fillRect(P+80,P+20,p1.special/100*196,5);
  ctx.strokeStyle='#444'; ctx.lineWidth=0.6; ctx.strokeRect(P+80,P+20,196,5);
  ctx.fillStyle=p1.special>=100?p1.cfg.specialColor:'#555'; ctx.font='5px monospace';
  ctx.fillText(p1.special>=100?'SPECIAL READY!':'SPECIAL',P+80,P+32);

  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W-P-290,P,290,42);
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='right';
  ctx.fillText(p2.cfg.name,W-P-4,P+13);
  ctx.fillStyle='#777'; ctx.font='6px monospace'; ctx.fillText(p2.cfg.movie,W-P-4,P+23);
  const p2hp=Math.max(0,p2.hp/100*196);
  ctx.fillStyle='#333'; ctx.fillRect(W-P-276,P+6,196,10);
  ctx.fillStyle=hpCol(p2.hp); ctx.fillRect(W-P-276+(196-p2hp),P+6,p2hp,10);
  ctx.strokeStyle='#666'; ctx.lineWidth=0.8; ctx.strokeRect(W-P-276,P+6,196,10);
  const p2sp=p2.special/100*196;
  ctx.fillStyle='#222'; ctx.fillRect(W-P-276,P+20,196,5);
  ctx.fillStyle=p2.cfg.specialColor; ctx.fillRect(W-P-276+(196-p2sp),P+20,p2sp,5);
  ctx.strokeStyle='#444'; ctx.lineWidth=0.6; ctx.strokeRect(W-P-276,P+20,196,5);
  ctx.fillStyle=p2.special>=100?p2.cfg.specialColor:'#555'; ctx.font='5px monospace';
  ctx.fillText(p2.special>=100?'SPECIAL READY!':'SPECIAL',W-P-80,P+32);

  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W/2-36,P,72,42);
  ctx.fillStyle='#fff'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillText(Math.max(0,Math.ceil(fightTimer)),W/2,P+26);
  ctx.fillStyle='#666'; ctx.font='5px monospace';
  ctx.fillText('ROUND '+round+'  '+scores.player+'–'+scores.cpu,W/2,P+38);
  ctx.textAlign='left';
}

// ── Touch controls overlay ────────────────────────────────────────────────────
function drawTouchControls(){
  if(!TOUCH||scene!=='fight') return;
  const az=activeTouch;

  function btn(x,y,w,h,label,color,active,big=false){
    ctx.save();
    ctx.globalAlpha=active?0.82:0.38;
    ctx.fillStyle=active?color:'#1a1a2e';
    rrect(x,y,w,h,10); ctx.fill();
    ctx.strokeStyle=active?color:'#445';
    ctx.lineWidth=active?2.5:1.5; rrect(x,y,w,h,10); ctx.stroke();
    ctx.globalAlpha=active?1:0.75;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${big?18:14}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,x+w/2,y+h/2);
    ctx.restore();
  }

  // D-pad (left)
  btn(ZONES.left.x,   ZONES.left.y,   ZONES.left.w,   ZONES.left.h,   '◀', '#3388ff', az.has('left'));
  btn(ZONES.jump.x,   ZONES.jump.y,   ZONES.jump.w,   ZONES.jump.h,   '▲', '#33aaff', az.has('jump'));
  btn(ZONES.right.x,  ZONES.right.y,  ZONES.right.w,  ZONES.right.h,  '▶', '#3388ff', az.has('right'));

  // Action buttons (right)
  btn(ZONES.block.x,  ZONES.block.y,  ZONES.block.w,  ZONES.block.h,  'BLK', '#888888', az.has('block'));
  btn(ZONES.attack.x, ZONES.attack.y, ZONES.attack.w, ZONES.attack.h, 'ATK', '#cc3333', az.has('attack'), true);
  const spReady=p1&&p1.special>=100;
  btn(ZONES.special.x,ZONES.special.y,ZONES.special.w,ZONES.special.h,'SP★', spReady?'#ffcc00':'#556655', az.has('special'));
}

// ── Action text ───────────────────────────────────────────────────────────────
function drawActionText(){
  if(actionTimer<=0) return;
  const a=Math.min(1,actionTimer*2.5), sc=1+(1-Math.min(1,actionTimer*1.5))*0.25;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(W/2,H/2-20); ctx.scale(sc,sc);
  ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.fillText(actionText,2,2);
  ctx.fillStyle=actionColor; ctx.fillText(actionText,0,0);
  ctx.restore();
}

// ── Screens ───────────────────────────────────────────────────────────────────
function drawTitle(){
  drawBg();
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 38px monospace'; ctx.fillStyle='#000'; ctx.fillText('PMOVIES ARENA',W/2+3,108+3);
  ctx.fillStyle='#ffcc00'; ctx.fillText('PMOVIES ARENA',W/2,108);
  ctx.font='bold 12px monospace'; ctx.fillStyle='#cc1111'; ctx.fillText('SPIDER-MAN  ✦  ODYSSEUS',W/2,140);
  ctx.font='8px monospace'; ctx.fillStyle='#666'; ctx.fillText('JULY 2025 · BEST OF 3 ROUNDS',W/2,158);
  if(Math.floor(Date.now()/550)%2){ ctx.font='bold 9px monospace'; ctx.fillStyle='#ffcc00'; ctx.fillText(TOUCH?'TAP TO START':'PRESS  ENTER  TO  START',W/2,220); }
  if(!TOUCH){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W/2-200,250,400,64);
    ctx.fillStyle='#555'; ctx.font='7px monospace';
    ['MOVE: A/D  or  ←/→','JUMP: W  or  ↑  or  SPACE','BLOCK: S  or  ↓     ATTACK: J','SPECIAL: L   (when meter is full)']
      .forEach((l,i)=>ctx.fillText(l,W/2-188,268+i*13));
  } else {
    ctx.fillStyle='#555'; ctx.font='7px monospace'; ctx.fillText('Use the on-screen buttons during the fight',W/2,268);
  }
  ctx.textAlign='left';
}

function drawSelect(){
  drawBg();
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 12px monospace'; ctx.fillStyle='#aaa'; ctx.fillText('CHOOSE YOUR FIGHTER',W/2,52);
  [{key:'spidey',lx:W/2-270,cx:W/2-160},{key:'odyssey',lx:W/2+30,cx:W/2+160}].forEach(({key,lx,cx})=>{
    const sel=playerChar===key;
    ctx.fillStyle=sel?(key==='spidey'?'rgba(204,17,17,0.15)':'rgba(184,134,11,0.15)'):'rgba(20,20,20,0.4)';
    ctx.fillRect(lx,66,228,240);
    ctx.strokeStyle=sel?CHARS[key].color:'#333'; ctx.lineWidth=sel?2.5:1; ctx.strokeRect(lx,66,228,240);
    drawFighter({charKey:key,x:cx,y:268,facing:key==='spidey'?1:-1,state:'idle',flash:0,cfg:CHARS[key]});
    ctx.fillStyle=sel?CHARS[key].color:'#777'; ctx.font='bold 9px monospace';
    ctx.fillText(CHARS[key].name,cx,84);
    ctx.fillStyle='#666'; ctx.font='6px monospace'; ctx.fillText(CHARS[key].movie,cx,96);
    const stats=key==='spidey'?[['SPD','████████░░'],['PWR','██████░░░░'],['DEF','█████░░░░░'],['SPE','████████░░']]
                               :[['SPD','█████░░░░░'],['PWR','████████░░'],['DEF','███████░░░'],['SPE','██████░░░░']];
    stats.forEach(([l,b],i)=>{ ctx.fillStyle=sel?CHARS[key].color:'#555'; ctx.fillText(l+' '+b,cx,290+i*12); });
    if(sel){ ctx.fillStyle=CHARS[key].color; ctx.font='7px monospace'; ctx.fillText('▲ SELECTED',cx,340); }
  });
  // Fight button (touch-friendly)
  const fbY=350;
  ctx.fillStyle=Math.floor(Date.now()/550)%2?'rgba(255,204,0,0.25)':'rgba(255,204,0,0.1)';
  rrect(W/2-80,fbY,160,36,8); ctx.fill();
  ctx.strokeStyle='#ffcc00'; ctx.lineWidth=1.5; rrect(W/2-80,fbY,160,36,8); ctx.stroke();
  ctx.fillStyle='#ffcc00'; ctx.font='bold 11px monospace'; ctx.fillText(TOUCH?'TAP HERE TO FIGHT →':'ENTER TO FIGHT →',W/2,fbY+22);
  ctx.textAlign='left';
}

function drawRoundEnd(){
  drawBg(); drawFighter(p1); drawFighter(p2); drawHUD();
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  const won=roundWinner==='player';
  ctx.textAlign='center';
  ctx.font='bold 30px monospace'; ctx.fillStyle='#000'; ctx.fillText(won?'YOU WIN!':'CPU WINS!',W/2+3,H/2-8+3);
  ctx.fillStyle=won?'#ffcc00':'#ff4444'; ctx.fillText(won?'YOU WIN!':'CPU WINS!',W/2,H/2-8);
  ctx.fillStyle='#888'; ctx.font='8px monospace'; ctx.fillText('Round '+round+' · Score: '+scores.player+'–'+scores.cpu,W/2,H/2+22);
  if(Math.floor(Date.now()/550)%2){ ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.fillText(TOUCH?'TAP TO CONTINUE':'PRESS ENTER TO CONTINUE',W/2,H/2+50); }
  ctx.textAlign='left';
}

function drawMatchEnd(){
  drawBg(); ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  const won=matchWinner==='player';
  ctx.textAlign='center';
  ctx.font='bold 42px monospace'; ctx.fillStyle='#000'; ctx.fillText(won?'VICTORY!':'DEFEAT!',W/2+3,H/2-25+3);
  ctx.fillStyle=won?'#ffcc00':'#cc2222'; ctx.fillText(won?'VICTORY!':'DEFEAT!',W/2,H/2-25);
  const wf=won?p1:p2; ctx.fillStyle=wf.cfg.color; ctx.font='bold 14px monospace'; ctx.fillText(wf.cfg.name+' WINS!',W/2,H/2+14);
  ctx.fillStyle='#777'; ctx.font='8px monospace'; ctx.fillText('Final: '+scores.player+' – '+scores.cpu,W/2,H/2+38);
  if(Math.floor(Date.now()/550)%2){ ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.fillText(TOUCH?'TAP TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN',W/2,H/2+64); }
  ctx.textAlign='left';
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  ctx.clearRect(0,0,W,H);

  if(scene==='title'){
    drawTitle();
    if(just('Enter')||just('Space')) { scene='select'; sfx.select(); }

  } else if(scene==='select'){
    drawSelect();
    if(just('KeyA')||just('ArrowLeft'))  { playerChar='spidey';  sfx.select(); }
    if(just('KeyD')||just('ArrowRight')) { playerChar='odyssey'; sfx.select(); }
    if(justAny('Enter','Space')) { round=1; scores={player:0,cpu:0}; initRound(); sfx.start(); }

  } else if(scene==='countdown'){
    drawBg(); drawFighter(p1); drawFighter(p2);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
    cdTimer-=dt; if(cdTimer<=0){ cdVal--; cdTimer=1.0; if(cdVal<0){ scene='fight'; sfx.start(); } }
    ctx.textAlign='center';
    const cd=cdVal>0?String(cdVal):'FIGHT!';
    ctx.font='bold 72px monospace'; ctx.fillStyle='#000'; ctx.fillText(cd,W/2+3,H/2+26+3);
    ctx.fillStyle='#ffcc00'; ctx.fillText(cd,W/2,H/2+26);
    ctx.fillStyle='#888'; ctx.font='8px monospace'; ctx.fillText('ROUND '+round,W/2,H/2-30);
    ctx.textAlign='left';

  } else if(scene==='fight'){
    // Keyboard movement
    if(!p1.ko){
      if(keys['KeyA']||keys['ArrowLeft'])  { if(p1.state!=='attack'&&p1.state!=='hurt') p1.vx=-p1.cfg.speed; }
      if(keys['KeyD']||keys['ArrowRight']) { if(p1.state!=='attack'&&p1.state!=='hurt') p1.vx= p1.cfg.speed; }
      if(justAny('KeyW','ArrowUp','Space')) p1.doJump();
      p1.doBlock(keys['KeyS']||keys['ArrowDown']);
      if(justAny('KeyJ','KeyZ','KeyN')) p1.doAttack();
      if(justAny('KeyL','KeyX','KeyM')) p1.doSpecial();
      // Touch movement
      if(activeTouch.has('left')  && p1.state!=='attack'&&p1.state!=='hurt') p1.vx=-p1.cfg.speed;
      if(activeTouch.has('right') && p1.state!=='attack'&&p1.state!=='hurt') p1.vx= p1.cfg.speed;
      if(touchPressed.has('jump'))    p1.doJump();
      if(touchPressed.has('attack'))  p1.doAttack();
      if(touchPressed.has('special')) p1.doSpecial();
      p1.doBlock((keys['KeyS']||keys['ArrowDown'])||activeTouch.has('block'));
    }

    p1.update(dt,p2); p2.update(dt,p1);
    checkHits(p1,p2); checkHits(p2,p1);
    fightTimer-=dt; actionTimer-=dt;

    drawBg(); drawFighter(p1); drawFighter(p2);
    drawTouchControls();
    drawHUD(); drawActionText();

    let winner=null;
    if(p1.hp<=0) winner='cpu';
    else if(p2.hp<=0) winner='player';
    else if(fightTimer<=0) winner=p1.hp>=p2.hp?'player':'cpu';
    if(winner){ roundWinner=winner; scores[winner]++; winner==='player'?sfx.win():sfx.ko(); scene='round_end'; roundEndTimer=3.5; }

  } else if(scene==='round_end'){
    roundEndTimer-=dt; drawRoundEnd();
    if(justAny('Enter','Space')||roundEndTimer<=0){
      if(scores.player>=2||scores.cpu>=2){ matchWinner=scores.player>=2?'player':'cpu'; scene='match_end'; }
      else { round++; initRound(); }
    }

  } else if(scene==='match_end'){
    drawMatchEnd();
    if(justAny('Enter','Space')){ round=1; scores={player:0,cpu:0}; scene='select'; }
  }

  touchPressed.clear();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
